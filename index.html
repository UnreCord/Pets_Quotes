<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cotización Corporativa – Soluciones Veterinarias SAC</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Variables Base (Modo Claro) */
      --verde: #007934;
      --verde-oscuro: #005a27;
      --verde-claro: #e8f5ee;
      --amarillo: #F4B223;
      --texto: #1a1a2e;
      --texto-claro: #64748b;
      --gris-fondo: #f8fafc;
      --borde: #e2e8f0;
      --blanco: #ffffff;
      --rojo: #dc2626;
      --bg-body: #eef2f7;
      --bg-cabecera-1: #fafffe;
      --bg-cabecera-2: #f0faf5;
    }

    /* Variables Modo Oscuro */
    body[data-theme="dark"] {
      --texto: #f1f5f9;
      --texto-claro: #94a3b8;
      --gris-fondo: #0f172a;
      --borde: #334155;
      --blanco: #1e293b;
      --verde-claro: #064e3b;
      --bg-body: #020617;
      --bg-cabecera-1: #1e293b;
      --bg-cabecera-2: #0f172a;
    }

    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Lato',sans-serif;background:var(--bg-body);color:var(--texto);min-height:100vh;padding:16px 10px 80px;line-height:1.45; transition: background 0.3s;}

    /* ── MODALES (VENDEDOR Y FIRMA) ── */
    .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.65);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:center;z-index:9999;}
    .modal-box{background:var(--blanco);padding:30px 28px;border-radius:6px;width:90%;max-width:400px;text-align:center;border:1px solid var(--borde);box-shadow:0 20px 60px rgba(0,0,0,.3);}
    .modal-logo{margin-bottom:14px;}
    .modal-logo img{width:100px;height:auto;}
    .modal-box h3{color:var(--texto);margin-bottom:4px;font-weight:900;font-size:17px;}
    .modal-box p{color:var(--texto-claro);font-size:12px;margin-bottom:18px;}
    .modal-sel{width:100%;padding:9px 12px;border:1.5px solid var(--borde);border-radius:5px;font-family:'Lato';font-size:13px;color:var(--texto);margin-bottom:12px;outline:none;background:var(--blanco);cursor:pointer;}
    .btn-ingresar{background:var(--verde);color:#fff;border:none;padding:11px 20px;width:100%;border-radius:5px;font-weight:700;font-size:13px;cursor:pointer;}

    .firma-overlay{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;backdrop-filter:blur(5px);padding:14px;}
    .firma-box{background:var(--blanco);border-radius:16px;padding:24px 22px 20px;width:100%;max-width:500px;display:flex;flex-direction:column;gap:16px;}
    .firma-canvas-wrap{border:2px dashed var(--verde);border-radius:12px;background:#fff;position:relative;overflow:hidden;}
    #firma-canvas{display:block;width:100%;cursor:crosshair;}
    .firma-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;pointer-events:none;}

    .hoja{max-width:900px;margin:0 auto;background:var(--blanco);box-shadow:0 4px 24px rgba(0,0,0,.15);border-radius:2px;border-top:4px solid var(--verde);}
